[env:esp32c3]
platform = espressif32@5.4.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    fbiego/CST816S@^1.1.1
    bblanchon/ArduinoJson@^6.21.5

build_src_filter = -<*> +<clawd_tank.cpp>

build_flags =
    ; === USB CDC Serial ===
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; === TFT_eSPI Configuration ===
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    ; SPI Pins
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=10
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=3
    ; SPI Frequency
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    ; Fonts (minimal)
    -DLOAD_GLCD=1
    -DSMOOTH_FONT=1

[env:cyd]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.5

build_src_filter = -<*> +<clawd_tank.cpp>

build_flags =
    ; === TFT_eSPI Configuration (CYD ILI9341) ===
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    ; Fonts
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSMOOTH_FONT=1
